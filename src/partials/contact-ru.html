<section class="contact section" id="kontakt" aria-labelledby="contact-title">
  <div class="container contact__grid">
    <div class="contact__main">
      <h2 class="h2" id="contact-title" data-reveal>Звоните <span class="accent">или приходите.</span></h2>
      <a class="contact__phone" href="tel:+4915560410413" data-reveal style="--stagger: 1">
        <svg class="icon" aria-hidden="true"><use href="/icons/sprite.svg#i-phone" /></svg>
        <span class="tabular">+49 155 60 41 04 13</span>
      </a>
      <dl class="facts" data-reveal style="--stagger: 2">
        <div>
          <dt>E-mail</dt>
          <dd><a href="mailto:service@fahrschule-strauch.de">service@fahrschule-strauch.de</a></dd>
        </div>
        <div>
          <dt>Адрес</dt>
          <dd lang="de">Schwarzwaldstraße 93<br />77933 Lahr</dd>
        </div>
        <div>
          <dt>Теоретические занятия</dt>
          <dd>Понедельник с 19:00 до 20:30<br />Среда по договорённости</dd>
        </div>
        <div>

          <dd>Немецкий и русский</dd>
        </div>

    <div class="contact__visual" data-reveal style="--stagger: 2">

        <rect x="40" y="0" width="12" height="300" rx="4" class="sign-pole" />
        <rect x="508" y="0" width="12" height="300" rx="4" class="sign-pole" />
        <g class="sign-board">
          <rect x="8" y="34" width="544" height="120" rx="10" class="sign-face" />
          <rect x="18" y="44" width="524" height="100" rx="5" class="sign-border" />
          <text x="280" y="116" text-anchor="middle" class="sign-text">Schwarzwaldstraße</text>
        </g>
        <g class="sign-number" transform="translate(338 186)">
          <rect width="132" height="90" rx="12" class="sign-number__plate" />
          <rect x="7" y="7" width="118" height="76" rx="7" class="sign-number__border" />
          <text x="66" y="66" text-anchor="middle" class="sign-number__text">93</text>
        </g>

      <a class="btn btn--secondary contact__route" href="https://www.google.com/maps/dir/?api=1&amp;destination=Schwarzwaldstra%C3%9Fe%2093%2C%2077933%20Lahr" rel="noopener" target="_blank">
